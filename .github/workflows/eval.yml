name: agent-quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate v2 against the recorded baseline
        env:
          AGENT_VERSION: v2
          PORT: "8002"
          MOCK_ERROR_RATE: "0"
          MOCK_SLOW_RATE: "0"
        run: |
          set -euo pipefail
          mkdir -p reports
          python app.py > reports/ci-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill -TERM "$agent_pid" 2>/dev/null || true; wait "$agent_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8002/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat reports/ci-agent.log
            exit 1
          fi
          python eval/run_eval.py --url http://localhost:8002 \
            --min-accuracy 1.0 --baseline reports/eval_v2.json --out reports/eval_ci.json
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
            06-lab-complete/benchmark-observability/develop/reports/ci-agent.log
          if-no-files-found: warn
